# Copies the site to redio-life-web, which serves it at radio.cybergistplanet.com.
# honwhitehat.github.io/redio-life/ only redirects there (see redirect-github-io.yml).
name: Copy to redio-life-web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          repositories: redio-life-web
      - name: Push the site files to redio-life-web
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/honwhitehat/redio-life-web.git" web
          rsync -a --delete --exclude .git --exclude .github --exclude CNAME --exclude worker src/ web/
          echo radio.cybergistplanet.com > web/CNAME
          # Stamp this release on the script links, so browsers never mix a new page with an old cached script
          sed -i -E "s/\?v=[0-9a-zA-Z]+\"/?v=${GITHUB_SHA::7}\"/g" web/index.html web/dashboard.html
          cd web
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="redio-life-sync-honwhitehat[bot]" -c user.email="5387680+redio-life-sync-honwhitehat[bot]@users.noreply.github.com" commit -m "Copy from redio-life ${GITHUB_SHA::7}"
          git push
