# Keeps GitHub Actions and the stats worker's tools up to date; opens PRs for security fixes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days before proposing updates to newly published versions, so a
    # freshly compromised or unstable release is less likely to land in a PR.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
