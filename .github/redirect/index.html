<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redio Life has moved</title>
  <!-- rel=canonical fetches no subresource, so Subresource Integrity (SRI) does not apply here -->
  <link rel="canonical" href="https://radio.cybergistplanet.com/"> <!-- nosemgrep: html.security.audit.missing-integrity.missing-integrity -->
  <script>
    location.replace("https://radio.cybergistplanet.com" + location.pathname.replace(/^\/redio-life/, "") + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=https://radio.cybergistplanet.com/">
</head>
<body>
  <a href="https://radio.cybergistplanet.com/">Redio Life has moved to radio.cybergistplanet.com</a>
</body>
</html>
